<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; font-src data:; connect-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"><title>Evaluation comparison</title><style>
*{box-sizing:border-box}body{margin:0;background:#fafbf5;color:#24392e;font:14px/1.5 ui-sans-serif,system-ui,sans-serif;padding:24px}main{max-width:950px;margin:auto}.kicker{font:10px ui-monospace,monospace;letter-spacing:1.5px;color:#617469}h1{font:600 29px/1.2 Georgia,serif;letter-spacing:-.5px;margin:12px 0 7px}.description{color:#617469;font-size:12px;margin:0 0 16px}.chart-head{display:flex;justify-content:space-between;align-items:center;gap:20px}.value{text-align:right;font:600 24px Georgia,serif;white-space:nowrap}.value small{display:block;font:10px ui-sans-serif,system-ui,sans-serif;color:#617469}.plot{display:block;width:100%;height:auto;overflow:visible}button{background:transparent;border:1px solid #bac9b3;border-radius:6px;padding:8px 12px;color:#38551d;font:11px ui-sans-serif,system-ui,sans-serif;cursor:pointer}button[aria-pressed="true"]{background:#e5edda;border-color:#7d9c65}button:focus-visible,input:focus-visible{outline:2px solid #527c40;outline-offset:3px}.controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:12px}.controls label{display:flex;flex:1;align-items:center;gap:12px;font-size:12px;min-width:200px}.controls input{flex:1;min-width:80px;accent-color:#527c40}.foot{font:9px ui-monospace,monospace;letter-spacing:1px;color:#718376;margin-top:18px}.axis{fill:#718376;font:11px ui-sans-serif,system-ui,sans-serif}.grid{stroke:#dce5d6;stroke-width:1}.legend{font-size:11px;color:#617469}.legend b{color:#527c40}.legend i{font-style:normal;color:#7d9eaf}@media(max-width:450px){body{padding:18px}h1{font-size:24px}.value{font-size:22px}.chart-head{align-items:flex-start;gap:12px}}
</style></head><body><main><div class="kicker">EVALUATOR / SYNTHETIC HTML DEMO</div><div class="chart-head"><div><h1>Evaluation comparison</h1><p class="description">Switch metrics to explore the finished dashboard</p></div><div id="summary" class="value"></div></div><div class="controls" style="margin:0 0 10px"><button id="accuracy" aria-pressed="true">Accuracy</button><button id="f1" aria-pressed="false">F1 score</button><span id="metric-label" class="legend">Accuracy on a synthetic validation set</span></div><svg class="plot" viewBox="0 0 720 290" role="img" aria-label="Comparison across baseline, first pass and final pass"><line class="grid" x1="55" x2="690" y1="240" y2="240"/><line class="grid" x1="55" x2="690" y1="190" y2="190"/><line class="grid" x1="55" x2="690" y1="140" y2="140"/><line class="grid" x1="55" x2="690" y1="90" y2="90"/><line class="grid" x1="55" x2="690" y1="40" y2="40"/><text class="axis" x="45" y="244" text-anchor="end">0%</text><text class="axis" x="45" y="194" text-anchor="end">25%</text><text class="axis" x="45" y="144" text-anchor="end">50%</text><text class="axis" x="45" y="94" text-anchor="end">75%</text><text class="axis" x="45" y="44" text-anchor="end">100%</text><rect id="bar-0" x="125" width="95" fill="#a3b8bf"/><text id="score-0" x="172.5" text-anchor="middle" fill="#38551d" font-size="18" font-weight="600"/><text class="axis" x="172.5" y="267" text-anchor="middle">Baseline</text><rect id="bar-1" x="330" width="95" fill="#9abd8b"/><text id="score-1" x="377.5" text-anchor="middle" fill="#38551d" font-size="18" font-weight="600"/><text class="axis" x="377.5" y="267" text-anchor="middle">First pass</text><rect id="bar-2" x="535" width="95" fill="#527c40"/><text id="score-2" x="582.5" text-anchor="middle" fill="#38551d" font-size="18" font-weight="600"/><text class="axis" x="582.5" y="267" text-anchor="middle">Final pass</text></svg><div class="foot">RELAY · FINISHED HTML, CREATED BY THE AGENT</div></main><script>const $=id=>document.getElementById(id);function render(metric){const values=metric==='accuracy'?[66,81,92]:[64,79,88];$('accuracy').setAttribute('aria-pressed',String(metric==='accuracy'));$('f1').setAttribute('aria-pressed',String(metric==='f1'));$('metric-label').textContent=(metric==='accuracy'?'Accuracy':'F1 score')+' on a synthetic validation set';values.forEach((v,i)=>{$('bar-'+i).setAttribute('y',240-v*2);$('bar-'+i).setAttribute('height',v*2);$('score-'+i).setAttribute('y',230-v*2);$('score-'+i).textContent=v+'%'});$('summary').innerHTML='<small>BEST SCORE</small><span id="best-score">'+values[2]+'%</span>'}$('accuracy').addEventListener('click',()=>render('accuracy'));$('f1').addEventListener('click',()=>render('f1'));render('accuracy');</script></body></html>
